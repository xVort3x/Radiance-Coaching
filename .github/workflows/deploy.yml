name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses the lockfile when you have committed one, otherwise installs fresh.
      - run: npm ci || npm install

      - run: npm run build
        env:
          # Optional settings live in the repository's Settings > Secrets and
          # variables > Actions > Variables. They are public once built.
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_BOOKING_API_URL: ${{ vars.VITE_BOOKING_API_URL }}
          VITE_PAYSTACK: ${{ vars.VITE_PAYSTACK }}
          VITE_PAY_USD: ${{ vars.VITE_PAY_USD }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_DEMO_PAYMENTS: ${{ vars.VITE_DEMO_PAYMENTS }}
          VITE_MPESA_TILL: ${{ vars.VITE_MPESA_TILL }}
          VITE_MPESA_PAYBILL: ${{ vars.VITE_MPESA_PAYBILL }}
          VITE_MPESA_ACCOUNT: ${{ vars.VITE_MPESA_ACCOUNT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CARD_CHECKOUT_URL: ${{ vars.VITE_CARD_CHECKOUT_URL }}
          VITE_CARD_CHECKOUT_URL_PACKAGE: ${{ vars.VITE_CARD_CHECKOUT_URL_PACKAGE }}
          VITE_CARD_CHECKOUT_VIA_API: ${{ vars.VITE_CARD_CHECKOUT_VIA_API }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

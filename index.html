    <meta name="color-scheme" content="light dark" />
    <script>
      // Sets light or dark before the page paints, so there is no flash. Uses the saved choice,
      // otherwise the device setting.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('rc-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#12171a');
      })();
    </script>
